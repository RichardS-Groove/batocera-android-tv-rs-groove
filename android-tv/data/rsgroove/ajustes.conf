# Ajustes que Android TV RS Groove necesita (los carga arranque.sh en cada arranque si no coinciden).
# Formato: espacio clave valor   (espacio = global, secure, system, prop = propiedad que se pierde al reiniciar,
#                                  file = archivo del sistema, acepta comodines)
global device_name Android TV RS Groove
global adb_enabled 1
global development_settings_enabled 1
global stay_on_while_plugged_in 1
global wifi_sleep_policy 2
# Nunca dormir (08/11/2026, pedido de la persona: «el modo suspensión tiene que estar desactivado»). Antes: dormía a
# las 24 h sin usar (86400000) y attentive_timeout vacío. -1 = nunca. La pantalla igual baja el brillo a los 15 min
# (en la tele no se nota). Volver: secure sleep_timeout 86400000.
secure sleep_timeout -1
secure attentive_timeout -1
# Idioma y reloj (07/11/2026). El nombre Bluetooth (el código de la placa) NO se cambia: Play reconoce el equipo por él.
prop persist.sys.locale es-AR
system time_12_24 24
# Menús más ágiles: animaciones a la mitad (07/11/2026, pedido de la persona). Volver: poner 1.0.
global window_animation_scale 0.5
global transition_animation_scale 0.5
global animator_duration_scale 0.5
# Video por la placa de video (controlador Intel iHD) en los decodificadores c2.ffmpeg, que Android ya pone primero
# para H.264, HEVC, VP9 y AV1 (07/11/2026; comprobado: el registro muestra getBufferVAAPI). Sin prueba por
# pedido de la persona. Si un video se ve verde, negro o trabado: cambiar el 1 por 0 y reiniciar Android.
prop debug.ffmpeg-codec2.hwaccel.drm 1
# Procesador en automático (07/11/2026, pedido de la persona): acelera solo cuando hace falta. Fijo al máximo
# (performance) llegaba a 90 °C y se frenaba solo (2.429 veces en 14 min): Android se sentía pegado.
# Volver al máximo: cambiar powersave por performance (calienta).
file /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor powersave
file /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference balance_performance
# Más lugar de memoria por programa (07/11/2026, pedido de la persona): el servicio de imágenes se cayó con
# «Scudo ERROR: internal map failure» mirando un video (tope de 65530 pedazos por programa; RAM sobraba).
# Igual que la Steam Deck. Volver: 65530.
file /proc/sys/vm/max_map_count 1048576
