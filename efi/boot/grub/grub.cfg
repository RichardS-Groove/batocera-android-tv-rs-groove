# Menú de arranque de Android TV — proyecto batocera-android-tv (RichardS-Groove), 07/11/2026
# Archivos de Android en la partición SHARE de la Batocera: /userdata/android-tv (= SHARE:/android-tv)
# Pantalla automática: el lanzador de la Batocera escribe /EFI/android/pantalla.cfg antes de reiniciar
#   tele conectada  -> set PANTALLA="video=eDP-1:d video=HDMI-A-1:1920x1080@60e"  (solo la tele)
#   sin tele        -> set PANTALLA=""                                             (pantalla de la notebook)
set timeout=5
set default=0
insmod part_gpt
insmod ext2
insmod all_video
insmod efi_gop
insmod gzio
set gfxpayload=keep
search --no-floppy --set=android --label SHARE
set BASE="root=/dev/ram0 ROOT=LABEL=SHARE SRC=/android-tv DEBUG=0 SET_TZ_LOCATION=America/Argentina/Buenos_Aires"
set SOLO_TELE="video=eDP-1:d video=HDMI-A-1:1920x1080@60e"
set SOLO_NOTEBOOK="video=HDMI-A-1:d"
set PANTALLA=""
if [ -f /EFI/android/pantalla.cfg ]; then source /EFI/android/pantalla.cfg; fi
export android BASE SOLO_TELE SOLO_NOTEBOOK PANTALLA

menuentry "Android TV" {
	linux ($android)/android-tv/kernel $BASE $PANTALLA
	initrd ($android)/android-tv/initrd.img
}
menuentry "Android TV (solo la tele)" {
	linux ($android)/android-tv/kernel $BASE $SOLO_TELE
	initrd ($android)/android-tv/initrd.img
}
menuentry "Android TV (solo la pantalla de la notebook)" {
	linux ($android)/android-tv/kernel $BASE $SOLO_NOTEBOOK
	initrd ($android)/android-tv/initrd.img
}
menuentry "Android TV (sin asistente inicial)" {
	linux ($android)/android-tv/kernel $BASE $PANTALLA SETUPWIZARD=0
	initrd ($android)/android-tv/initrd.img
}
menuentry "Android TV (video seguro, sin aceleración)" {
	linux ($android)/android-tv/kernel $BASE $PANTALLA nomodeset HWACCEL=0
	initrd ($android)/android-tv/initrd.img
}
menuentry "Volver a Batocera" {
	reboot
}
